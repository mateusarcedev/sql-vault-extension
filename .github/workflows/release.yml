name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Package
        run: npx vsce package --out "sqlvault-${GITHUB_REF_NAME}.vsix"

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath "sqlvault-${GITHUB_REF_NAME}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0.10 publish "sqlvault-${GITHUB_REF_NAME}.vsix"

      - name: GitHub release
        run: gh release create "${GITHUB_REF_NAME}" "sqlvault-${GITHUB_REF_NAME}.vsix" --title "${GITHUB_REF_NAME}" --notes "See [CHANGELOG.md](CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ github.token }}
