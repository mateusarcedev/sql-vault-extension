name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile and unit tests
        run: npm test
      - name: Package
        run: npx vsce package --out sqlvault.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: sqlvault-vsix
          path: sqlvault.vsix

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode-version: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Extension tests on VS Code ${{ matrix.vscode-version }}
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
